<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#5E3F87">
<title>모아봇 | 「모두의 아이디어」 아이디어 고도화 프로그램 안내</title>
<meta name="description" content="「모두의 아이디어」 아이디어 고도화 프로그램 안내 챗봇입니다.">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<style>
:root {
  --color-primary-light: #C4B0DC;
  --color-primary: #9B7CB9;
  --color-primary-deep: #5E3F87;
  --color-accent-coral: #F4A48C;
  --color-accent-pink: #E87B9D;
  --color-accent-warm: #FF9B7A;
  --color-bg: #FAFAFB;
  --color-bg-chat: #FFFFFF;
  --color-bg-soft: #F5F1F8;
  --color-text: #2B2438;
  --color-text-soft: #6B6378;
  --color-border: #E8E0EE;
  --gradient-hero: linear-gradient(135deg, #F4A48C 0%, #E87B9D 35%, #9B7CB9 70%, #5E3F87 100%);
  --shadow-soft: 0 2px 12px rgba(94, 63, 135, 0.08);
  --shadow-lift: 0 4px 20px rgba(94, 63, 135, 0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  color: var(--color-text);
  background: var(--color-bg);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 720px;
  margin: 0 auto;
  background: var(--color-bg-chat);
}

.header {
  background: var(--gradient-hero);
  color: white;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow-soft);
  flex-shrink: 0;
}
.header-logo {
  width: 42px;
  height: 42px;
  background: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 800;
  color: var(--color-primary-deep);
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.header-text { flex: 1; min-width: 0; }
.header-title { font-size: 18px; font-weight: 700; line-height: 1.2; }
.header-sub { font-size: 12px; font-weight: 400; opacity: 0.92; margin-top: 3px; }
.header-contact { font-size: 10.5px; opacity: 0.88; text-align: right; line-height: 1.4; flex-shrink: 0; }
.header-contact-tel { font-weight: 700; font-size: 12px; }

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  -webkit-overflow-scrolling: touch;
}

.bubble {
  max-width: 88%;
  padding: 12px 16px;
  font-size: 15px;
  line-height: 1.6;
  animation: enter 0.25s ease-out;
  word-break: keep-all;
  overflow-wrap: break-word;
}
@keyframes enter {
  from { transform: translateY(8px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.bubble.bot {
  align-self: flex-start;
  background: var(--color-bg-soft);
  color: var(--color-text);
  border-radius: 4px 16px 16px 16px;
  position: relative;
}
.bubble.bot::before {
  content: '"';
  position: absolute;
  top: -6px;
  left: -6px;
  font-size: 32px;
  font-weight: 700;
  color: var(--color-primary);
  font-family: Georgia, serif;
  opacity: 0.55;
  line-height: 1;
}

.bubble.user {
  align-self: flex-end;
  background: var(--color-primary);
  color: white;
  border-radius: 16px 4px 16px 16px;
}

.bubble strong { font-weight: 700; }

.source {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed rgba(94, 63, 135, 0.25);
  font-size: 12px;
  color: var(--color-text-soft);
  line-height: 1.5;
}

.suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
  padding: 4px 0;
}
.suggestion-btn {
  padding: 10px 14px;
  background: white;
  border: 1.5px solid var(--color-primary-light);
  border-radius: 24px;
  color: var(--color-primary-deep);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.suggestion-btn:hover {
  background: var(--color-bg-soft);
  border-color: var(--color-primary);
  transform: translateY(-2px);
  box-shadow: var(--shadow-soft);
}
.suggestion-btn:active { transform: scale(0.97); }

.input-area {
  border-top: 1px solid var(--color-border);
  padding: 12px 16px;
  background: white;
  flex-shrink: 0;
}
.input-form {
  display: flex;
  gap: 8px;
  align-items: center;
}
.input-field {
  flex: 1;
  padding: 12px 16px;
  border: 2px solid var(--color-border);
  border-radius: 24px;
  font-family: inherit;
  font-size: 15px;
  outline: none;
  transition: border-color 0.15s;
  background: white;
  color: var(--color-text);
}
.input-field:focus { border-color: var(--color-primary); }
.input-field:disabled { background: #F5F5F5; cursor: not-allowed; }
.send-btn {
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: var(--color-primary-deep);
  color: white;
  cursor: pointer;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
  font-weight: 700;
}
.send-btn:hover:not(:disabled) {
  background: var(--color-primary);
  transform: scale(1.05);
}
.send-btn:active { transform: scale(0.97); }
.send-btn:disabled { background: #C0C0C0; cursor: not-allowed; }

.disclaimer {
  text-align: center;
  font-size: 11px;
  color: var(--color-text-soft);
  padding: 8px 16px;
  background: #F8F6FA;
  flex-shrink: 0;
  line-height: 1.5;
}

.typing-bubble {
  padding: 0 !important;
}
.typing {
  display: flex;
  gap: 5px;
  padding: 14px 18px;
  align-items: center;
}
.typing span {
  width: 8px;
  height: 8px;
  background: var(--color-primary-light);
  border-radius: 50%;
  animation: bounce 1.4s infinite ease-in-out both;
}
.typing span:nth-child(1) { animation-delay: -0.32s; }
.typing span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
  40% { transform: scale(1); opacity: 1; }
}

@media (max-width: 480px) {
  .header { padding: 12px 14px; gap: 10px; }
  .header-title { font-size: 16px; }
  .header-sub { font-size: 11px; }
  .header-logo { width: 38px; height: 38px; font-size: 18px; }
  .bubble { font-size: 14px; max-width: 92%; }
  .suggestion-btn { font-size: 12px; padding: 9px 12px; }
  .chat { padding: 16px 12px 10px; }
}

@media (min-width: 768px) {
  .app { box-shadow: var(--shadow-lift); }
  .header { padding: 20px 24px; }
  .chat { padding: 24px 20px 16px; }
}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-logo" aria-hidden="true">모</div>
    <div class="header-text">
      <div class="header-title">모아봇</div>
      <div class="header-sub">「모두의 아이디어」 고도화 프로그램 안내</div>
    </div>
    <div class="header-contact">
      대국민 상담센터<br>
      <span class="header-contact-tel">1811-6095</span>
    </div>
  </header>

  <main class="chat" id="chat" role="log" aria-live="polite"></main>

  <form class="input-area" id="form">
    <div class="input-form">
      <input
        type="text"
        class="input-field"
        id="input"
        placeholder="궁금하신 사항을 질문해주십시오"
        autocomplete="off"
        maxlength="500"
        aria-label="질문 입력">
      <button type="submit" class="send-btn" id="send" aria-label="전송">→</button>
    </div>
  </form>

  <div class="disclaimer">
    본 답변은 가이드북 기반입니다. 확정 정보는 1811-6095(평일 09:00~18:00)로 확인해주십시오.
  </div>
</div>

<script>
const SUGGESTED_QUESTIONS = [
  "워크숍은 언제, 어디서 진행되나요?",
  "프로그램 진행 중 미팅은 총 몇 번 있나요?",
  "어떤 지원을 받게 되나요?",
  "특허출원 비용은 누가 부담하나요?",
  "미팅 일정 변경은 어떻게 하나요?",
  "본업이 바빠 평일 미팅이 어려운데 가능한가요?",
  "2차 심사에서 시작품 시연이 가능한가요?",
  "프로그램 결과물의 소유권은 누구에게 있나요?"
];

const WELCOME_MESSAGE = `안녕하십니까, 제안자님.
저는 「모두의 아이디어」 아이디어 고도화 프로그램 안내 챗봇 **모아봇**입니다.

가이드북에 담긴 내용을 바탕으로 다음과 같은 사항을 안내해드립니다.

· 프로그램 일정과 미팅 진행 방식
· 받게 되는 지원 내용 (자문 의견서, 특허출원, 시뮬레이션 등)
· 단계별 진행 절차와 제출 서류
· 권리·비용·심사 관련 유의사항

궁금하신 사항을 자유롭게 질문해주십시오.`;

const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

let conversationHistory = [];

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderMessage(text, role) {
  const div = document.createElement('div');
  div.className = `bubble ${role}`;

  let html = escapeHtml(text);

  // 출처 분리 (📖 출처: ...)
  const sourceMatch = html.match(/📖\s*출처[\s\S]*$/);
  let body = html;
  let source = '';
  if (sourceMatch) {
    body = html.substring(0, sourceMatch.index).trim();
    source = sourceMatch[0];
  }

  body = body.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  body = body.replace(/\n/g, '<br>');
  source = source.replace(/\n/g, '<br>');

  div.innerHTML = body;
  if (source) {
    const sourceDiv = document.createElement('div');
    sourceDiv.className = 'source';
    sourceDiv.innerHTML = source;
    div.appendChild(sourceDiv);
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function renderSuggestions() {
  const wrap = document.createElement('div');
  wrap.className = 'suggestions';
  wrap.id = 'suggestions';
  SUGGESTED_QUESTIONS.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'suggestion-btn';
    btn.type = 'button';
    btn.textContent = q;
    btn.onclick = () => {
      input.value = q;
      form.dispatchEvent(new Event('submit', { cancelable: true }));
    };
    wrap.appendChild(btn);
  });
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'bubble bot typing-bubble';
  div.id = 'typing';
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function removeSuggestions() {
  const s = document.getElementById('suggestions');
  if (s) s.remove();
}

async function sendMessage(message) {
  sendBtn.disabled = true;
  input.disabled = true;

  removeSuggestions();
  renderMessage(message, 'user');
  conversationHistory.push({ role: 'user', content: message });

  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: conversationHistory })
    });

    if (!res.ok) throw new Error('API 응답 오류: ' + res.status);

    const data = await res.json();
    removeTyping();

    renderMessage(data.reply, 'bot');
    conversationHistory.push({ role: 'assistant', content: data.reply });
  } catch (err) {
    console.error(err);
    removeTyping();
    renderMessage(
      '일시적으로 응답을 받지 못했습니다. 잠시 후 다시 시도해주십시오. 긴급한 사항은 대국민 상담센터(1811-6095, 평일 09:00~18:00)로 문의해주십시오.',
      'bot'
    );
  } finally {
    sendBtn.disabled = false;
    input.disabled = false;
    input.value = '';
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message || sendBtn.disabled) return;
  sendMessage(message);
});

renderMessage(WELCOME_MESSAGE, 'bot');
renderSuggestions();
</script>

</body>
</html>
