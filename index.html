<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>모아봇 | 「모두의 아이디어」 아이디어 고도화 프로그램 안내</title>
<meta name="description" content="「모두의 아이디어」 아이디어 고도화 프로그램(기술 분야) 안내 챗봇입니다.">

<link rel="preload" as="image" href="logo-white.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<style>
:root {
  --color-primary-light: #C4B0DC;
  --color-primary: #9B7CB9;
  --color-primary-deep: #5E3F87;
  --color-accent-coral: #F4A48C;
  --color-accent-pink: #E87B9D;
  --color-accent-warm: #FF9B7A;
  --color-bg: #FAFAFB;
  --color-bg-chat: #FFFFFF;
  --color-bg-soft: #F5F1F8;
  --color-text: #2B2438;
  --color-text-soft: #6B6378;
  --color-text-muted: #8B8295;
  --color-border: #E8E0EE;
  --gradient-hero: linear-gradient(135deg, #F4A48C 0%, #E87B9D 35%, #9B7CB9 70%, #5E3F87 100%);
  --shadow-soft: 0 2px 12px rgba(94, 63, 135, 0.08);
  --shadow-lift: 0 4px 20px rgba(94, 63, 135, 0.12);
  --shadow-header: 0 4px 16px rgba(94, 63, 135, 0.22);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  color: var(--color-text);
  background: var(--color-bg);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

button {
  font-family: inherit;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 720px;
  margin: 0 auto;
  background: var(--color-bg-chat);
}

/* ────────────────────────────────
   헤더 (그라데이션 + 로고 카드 + 새 대화)
   ──────────────────────────────── */
.header {
  background: var(--gradient-hero);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow-header);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}

.header-logo-btn {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  transition: transform 0.15s ease, opacity 0.15s ease;
  flex-shrink: 0;
  outline: none;
}
.header-logo-btn:hover { opacity: 0.9; }
.header-logo-btn:active { transform: scale(0.97); }
.header-logo-btn:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.7); outline-offset: 3px; border-radius: 4px;
}
.header-logo-img {
  height: 30px;
  width: auto;
  display: block;
  filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.22));
}

.header-text {
  flex: 1;
  min-width: 0;
  color: white;
}
.header-title {
  font-size: 18px;
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -0.4px;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
}
.header-sub {
  font-size: 11.5px;
  color: rgba(255, 255, 255, 0.92);
  margin-top: 3px;
  font-weight: 500;
  letter-spacing: -0.1px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.header-btn {
  background: rgba(255, 255, 255, 0.18);
  border: 1.5px solid rgba(255, 255, 255, 0.42);
  color: white;
  font-size: 12.5px;
  font-weight: 600;
  padding: 8px 13px;
  border-radius: 20px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  flex-shrink: 0;
  white-space: nowrap;
  text-decoration: none;
}
.header-btn:hover {
  background: rgba(255, 255, 255, 0.3);
  border-color: rgba(255, 255, 255, 0.65);
}
.header-btn:active { transform: scale(0.95); }
.header-btn:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.7); outline-offset: 2px;
}
.header-btn svg {
  width: 14px;
  height: 14px;
  stroke-width: 2.5;
  flex-shrink: 0;
}

/* ────────────────────────────────
   대화 영역
   ──────────────────────────────── */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  -webkit-overflow-scrolling: touch;
}

.bubble {
  max-width: 88%;
  padding: 12px 16px;
  font-size: 15px;
  line-height: 1.6;
  animation: enter 0.25s ease-out;
  word-break: keep-all;
  overflow-wrap: break-word;
}
@keyframes enter {
  from { transform: translateY(8px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.bubble.bot {
  align-self: flex-start;
  background: var(--color-bg-soft);
  color: var(--color-text);
  border-radius: 4px 16px 16px 16px;
  position: relative;
}
.bubble.bot::before {
  content: '"';
  position: absolute;
  top: -6px;
  left: -6px;
  font-size: 32px;
  font-weight: 700;
  color: var(--color-primary);
  font-family: Georgia, serif;
  opacity: 0.55;
  line-height: 1;
}

.bubble.user {
  align-self: flex-end;
  background: var(--color-primary);
  color: white;
  border-radius: 16px 4px 16px 16px;
}

.bubble strong { font-weight: 700; }
.bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13px; width: 100%; }
.bubble th, .bubble td { border: 1px solid var(--color-border); padding: 6px 8px; text-align: left; }
.bubble th { background: rgba(155, 124, 185, 0.12); font-weight: 600; }
.bubble code { background: rgba(94, 63, 135, 0.08); padding: 1px 5px; border-radius: 3px; font-size: 13px; }

.source {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed rgba(94, 63, 135, 0.25);
  font-size: 12px;
  color: var(--color-text-soft);
  line-height: 1.5;
}

/* ────────────────────────────────
   카테고리화된 추천 질문
   ──────────────────────────────── */
.suggestions {
  margin-top: 4px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.suggest-category {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.suggest-category-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-primary-deep);
  letter-spacing: -0.2px;
  padding-left: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.suggest-category-icon { font-size: 14px; }
.suggest-category-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.suggestion-btn {
  padding: 9px 13px;
  background: white;
  border: 1.5px solid var(--color-primary-light);
  border-radius: 22px;
  color: var(--color-primary-deep);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  line-height: 1.35;
}
.suggestion-btn:hover {
  background: var(--color-bg-soft);
  border-color: var(--color-primary);
  transform: translateY(-2px);
  box-shadow: var(--shadow-soft);
}
.suggestion-btn:active { transform: scale(0.97); }

/* ────────────────────────────────
   입력 영역 + 하단
   ──────────────────────────────── */
.input-area {
  border-top: 1px solid var(--color-border);
  padding: 12px 16px;
  background: white;
  flex-shrink: 0;
}
.input-form {
  display: flex;
  gap: 8px;
  align-items: center;
}
.input-field {
  flex: 1;
  padding: 12px 16px;
  border: 2px solid var(--color-border);
  border-radius: 24px;
  font-family: inherit;
  font-size: 16px;
  outline: none;
  transition: border-color 0.15s;
  background: white;
  color: var(--color-text);
}
.input-field:focus { border-color: var(--color-primary); }
.input-field:disabled { background: #F5F5F5; cursor: not-allowed; }
.send-btn {
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: var(--color-primary-deep);
  color: white;
  cursor: pointer;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
  font-weight: 700;
}
.send-btn:hover:not(:disabled) {
  background: var(--color-primary);
  transform: scale(1.05);
}
.send-btn:active { transform: scale(0.97); }
.send-btn:disabled { background: #C0C0C0; cursor: not-allowed; }

.disclaimer {
  text-align: center;
  font-size: 11px;
  color: var(--color-text-soft);
  padding: 8px 16px;
  background: #F8F6FA;
  flex-shrink: 0;
  line-height: 1.6;
}
.disclaimer-contact {
  margin-top: 2px;
  font-size: 10.5px;
  color: var(--color-text-muted);
}

.typing-bubble { padding: 0 !important; }
.typing {
  display: flex; gap: 5px; padding: 14px 18px; align-items: center;
}
.typing span {
  width: 8px; height: 8px;
  background: var(--color-primary-light);
  border-radius: 50%;
  animation: bounce 1.4s infinite ease-in-out both;
}
.typing span:nth-child(1) { animation-delay: -0.32s; }
.typing span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
  40% { transform: scale(1); opacity: 1; }
}

/* ────────────────────────────────
   반응형
   ──────────────────────────────── */
@media (max-width: 480px) {
  .header { padding: 10px 12px; gap: 8px; }
  .header-logo-img { height: 24px; }
  .header-title { font-size: 16px; }
  .header-sub { font-size: 10.5px; }
  .header-actions { gap: 6px; }
  .header-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    padding: 0;
    gap: 0;
    justify-content: center;
  }
  .header-btn .btn-label { display: none; }
  .header-btn svg { width: 16px; height: 16px; }
  .bubble { font-size: 14px; max-width: 92%; }
  .suggestion-btn { font-size: 12px; padding: 8px 11px; }
  .chat { padding: 16px 12px 10px; }
}

@media (min-width: 768px) {
  .app { box-shadow: var(--shadow-lift); }
  .header { padding: 16px 22px; gap: 14px; }
  .header-logo-img { height: 34px; }
  .header-title { font-size: 20px; }
  .header-sub { font-size: 12.5px; }
  .chat { padding: 24px 20px 16px; }
}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <button class="header-logo-btn" id="logoBtn" type="button" aria-label="처음 화면으로 돌아가기">
      <img src="logo-white.png" alt="모두의 아이디어" class="header-logo-img" width="600" height="141">
    </button>
    <div class="header-text">
      <div class="header-title">모아봇</div>
      <div class="header-sub">아이디어 고도화 프로그램 안내</div>
    </div>
    <div class="header-actions">
      <a class="header-btn" id="guideBtn" href="https://moduidea-tech-guidebook.vercel.app" aria-label="가이드북 보기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span class="btn-label">가이드북</span>
      </a>
      <button class="header-btn" id="resetBtn" type="button" aria-label="새 대화 시작">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        <span class="btn-label">새 대화</span>
      </button>
    </div>
  </header>

  <main class="chat" id="chat" role="log" aria-live="polite"></main>

  <form class="input-area" id="form">
    <div class="input-form">
      <input
        type="text"
        class="input-field"
        id="input"
        placeholder="궁금하신 사항을 질문해주십시오"
        autocomplete="off"
        maxlength="500"
        aria-label="질문 입력">
      <button type="submit" class="send-btn" id="send" aria-label="전송">→</button>
    </div>
  </form>

  <div class="disclaimer">
    문의 전 챗봇과 가이드북을 먼저 활용해주십시오. 부족할 경우 프로그램 담당자에게 연락해주십시오.
    <div class="disclaimer-contact">📞 02-6338-1726 · 📧 rnbdpartners@gmail.com</div>
  </div>
</div>

<script>
const WELCOME_MESSAGE = `안녕하십니까, 제안자님.
저는 「모두의 아이디어」 아이디어 고도화 프로그램(기술 분야) 안내 챗봇 **모아봇**입니다.

가이드북에 담긴 내용을 바탕으로 다음과 같은 사항을 안내해드립니다.

· 프로그램 일정과 미팅 진행 방식
· 받게 되는 지원 내용 (자문 의견서, 특허출원, 시뮬레이션 등)
· 단계별 진행 절차와 제출 서류
· 권리·비용·심사 관련 유의사항

아래 카테고리별 추천 질문을 눌러보시거나, 자유롭게 질문해주십시오.

**💡 활용 안내**
· 담당자에게 연락 전, **본 챗봇과 가이드북을 먼저 활용**해주십시오.
· 답변 하단의 출처 표시는 가이드북의 해당 장·절 위치를 의미합니다 (상단 **가이드북** 버튼에서 직접 확인 가능).
· 챗봇·가이드북으로 부족하거나 이해가 어려운 경우, 프로그램 담당자(02-6338-1726 · rnbdpartners@gmail.com)에게 연락해주십시오.`;

const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const logoBtn = document.getElementById('logoBtn');
const resetBtn = document.getElementById('resetBtn');

let conversationHistory = [];
let presetData = null;
let chatGen = 0;   // 대화 세대 (새 대화 시 +1 → 진행 중 요청 무효화)

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function mdToHtml(text) {
  const boldify = (t) => t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // 끝/앞 파이프 누락에도 견고한 셀 파싱
  const parseCells = (row) => row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());

  const lines = escapeHtml(text).split('\n');
  const out = [];
  const tables = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    const next = i + 1 < lines.length ? lines[i + 1].trim() : '';
    const isTable = line.trim().startsWith('|') && /^\|?[\s|:\-]+\|?$/.test(next) && next.indexOf('-') > -1;
    if (isTable) {
      const header = parseCells(line);
      let tbl = '<table><thead><tr>' + header.map(c => `<th>${boldify(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && lines[i].trim().startsWith('|')) {
        const cells = parseCells(lines[i]);
        tbl += '<tr>' + cells.map(c => `<td>${boldify(c)}</td>`).join('') + '</tr>';
        i++;
      }
      tbl += '</tbody></table>';
      out.push('@@MOABOT_TABLE_' + tables.length + '@@');
      tables.push(tbl);
      continue;
    }
    out.push(line);
    i++;
  }

  let html = boldify(out.join('\n'));
  html = html.replace(/\n/g, '<br>');
  // 표 토큰 복원 + 표 인접 <br> 정리 (표 위아래 과도한 여백 방지)
  tables.forEach((tbl, idx) => {
    const re = new RegExp('(?:<br>\s*)*@@MOABOT_TABLE_' + idx + '@@(?:\s*<br>)*', 'g');
    html = html.replace(re, tbl);
  });
  return html;
}

function renderMessage(text, role, parseSource) {
  const div = document.createElement('div');
  div.className = `bubble ${role}`;
  let body = text;
  let source = '';
  // 출처 분리는 실제 답변(parseSource=true)에만 적용.
  // "줄 시작"의 "📖 출처:"(콜론) 형식만 인식 → 본문 중간 문구·표 안의 텍스트는 잘리지 않음
  if (parseSource) {
    const sourceMatch = text.match(/(?:^|\n)[ \t]*📖\s*출처\s*:[\s\S]*$/);
    if (sourceMatch) {
      body = text.substring(0, sourceMatch.index).trim();
      source = sourceMatch[0].replace(/^[\s]+/, '');
    }
  }
  div.innerHTML = mdToHtml(body);
  if (source) {
    const sourceDiv = document.createElement('div');
    sourceDiv.className = 'source';
    sourceDiv.innerHTML = mdToHtml(source);
    div.appendChild(sourceDiv);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function renderSuggestions() {
  const wrap = document.createElement('div');
  wrap.className = 'suggestions';
  wrap.id = 'suggestions';
  if (!presetData || !presetData.categories) return wrap;
  presetData.categories.forEach(cat => {
    const catDiv = document.createElement('div');
    catDiv.className = 'suggest-category';
    const label = document.createElement('div');
    label.className = 'suggest-category-label';
    label.innerHTML = `<span class="suggest-category-icon">${escapeHtml(cat.icon || '·')}</span> ${escapeHtml(cat.label)}`;
    catDiv.appendChild(label);
    const btns = document.createElement('div');
    btns.className = 'suggest-category-buttons';
    cat.questions.forEach(q => {
      const btn = document.createElement('button');
      btn.className = 'suggestion-btn';
      btn.type = 'button';
      btn.textContent = q.text;
      btn.onclick = () => {
        input.value = q.text;
        form.dispatchEvent(new Event('submit', { cancelable: true }));
      };
      btns.appendChild(btn);
    });
    catDiv.appendChild(btns);
    wrap.appendChild(catDiv);
  });
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return wrap;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'bubble bot typing-bubble';
  div.id = 'typing';
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function removeSuggestions() {
  const s = document.getElementById('suggestions');
  if (s) s.remove();
}

async function sendMessage(message) {
  const myGen = chatGen;   // 이 요청의 세대 — 새 대화 시 무효화 판별용
  sendBtn.disabled = true;
  input.disabled = true;

  removeSuggestions();
  renderMessage(message, 'user');
  conversationHistory.push({ role: 'user', content: message });

  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify({ messages: conversationHistory }),
    });
    if (!res.ok) throw new Error('API 응답 오류: ' + res.status);
    const data = await res.json();
    if (myGen !== chatGen) return;   // 응답 도착 전 '새 대화'가 눌렸으면 무시
    removeTyping();
    renderMessage(data.reply, 'bot', true);
    conversationHistory.push({ role: 'assistant', content: data.reply });
  } catch (err) {
    console.error(err);
    if (myGen !== chatGen) return;
    removeTyping();
    renderMessage(
      '일시적으로 응답을 받지 못했습니다. 잠시 후 다시 시도해주십시오. 긴급한 사항은 프로그램 담당자(02-6338-1726, rnbdpartners@gmail.com)로 문의해주십시오.',
      'bot'
    );
  } finally {
    if (myGen === chatGen) {
      sendBtn.disabled = false;
      input.disabled = false;
      input.value = '';
      input.focus();
    }
  }
}

function resetChat() {
  // 진행 중인 요청 무효화 (늦게 도착한 응답이 빈 화면에 끼어드는 것 방지)
  chatGen++;
  conversationHistory = [];
  chat.innerHTML = '';
  renderMessage(WELCOME_MESSAGE, 'bot');
  renderSuggestions();
  input.value = '';
  sendBtn.disabled = false;
  input.disabled = false;
  // 모바일에서 키보드 자동 활성화 방지 (스크롤 위로 유지)
  if (window.innerWidth > 768) input.focus();
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message || sendBtn.disabled) return;
  sendMessage(message);
});

logoBtn.addEventListener('click', resetChat);
resetBtn.addEventListener('click', resetChat);

(async function init() {
  renderMessage(WELCOME_MESSAGE, 'bot');
  try {
    const res = await fetch('/preset_answers.json', { cache: 'force-cache' });
    presetData = await res.json();
  } catch (e) {
    console.error('preset 로드 실패:', e);
  }
  renderSuggestions();
})();
</script>
